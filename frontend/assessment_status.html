<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>职业测评问卷</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e8f0fe;
      --bg-grid: rgba(255,255,255,0.6);
      --white: #ffffff;
      --accent: #4f7cff;
      --accent2: #5c6bc0;
      --text: #1a2340;
      --text-dim: #5a6a8a;
      --text-muted: #aab4cc;
      --border: rgba(79,124,255,0.12);
      --green: #00b894;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding: 24px 20px 48px;
      position: relative;
      overflow-x: hidden;
    }
    /* 背景网格与圆点（参考图） */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(79,124,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,124,255,0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(79,124,255,0.06) 0%, transparent 45%),
                  radial-gradient(circle at 80% 70%, rgba(92,107,192,0.05) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }
    .page-wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
    }
    .bc-tag {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
    }
    .bc-sep { color: var(--text-muted); font-size: 12px; }
    .bc-cur { color: var(--text-dim); font-size: 12px; }

    .page-header { margin-bottom: 24px; }
    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .page-desc {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
    }

    /* 主卡片：大圆角白卡 */
    .main-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(79,100,200,0.1);
      overflow: hidden;
      margin-bottom: 32px;
      animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-body {
      padding: 48px 40px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .illustration {
      width: 100px;
      height: 100px;
      margin-bottom: 24px;
    }
    .illus-circle {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(0,184,148,0.12), rgba(0,184,148,0.08));
      border: 2px solid rgba(0,184,148,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 42px;
    }

    .status-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .status-desc {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.7;
      max-width: 400px;
      margin-bottom: 28px;
    }

    /* 报告信息条：完成题目 20 道，能力详细分析得分（5 维度等权） */
    .report-meta {
      display: flex;
      gap: 16px;
      padding: 16px 20px;
      background: rgba(79,124,255,0.05);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 28px;
      width: 100%;
      max-width: 520px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .meta-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 90px;
    }
    .meta-item + .meta-item { border-left: 1px solid var(--border); padding-left: 16px; }
    .meta-item:first-child { border-left: none; padding-left: 0; }
    .meta-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .meta-val { font-size: 15px; font-weight: 600; color: var(--text); }
    .meta-val.accent { color: var(--accent); }
    .meta-val.green { color: var(--green); }

    /* 按钮组：主按钮实心蓝，次按钮描边 */
    .btn-group {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 480px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 13px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      flex: 1;
      min-width: 140px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 16px rgba(79,124,255,0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(79,124,255,0.38);
    }
    .btn-secondary {
      flex: 1;
      min-width: 120px;
      background: var(--white);
      color: var(--accent);
      border: 1.5px solid var(--accent);
    }
    .btn-secondary:hover {
      background: rgba(79,124,255,0.06);
    }

    .card-footer {
      padding: 14px 40px;
      border-top: 1px solid rgba(79,124,255,0.08);
      background: rgba(242,245,255,0.5);
      text-align: center;
    }
    .footer-text { font-size: 12px; color: var(--text-muted); }
    .footer-text span { color: var(--accent); font-weight: 500; }

    /* ========== 能力详细分析（严格按 ability_detail 样式） ========== */
    .ability-section {
      max-width: 720px;
      margin: 0 auto;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .section-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ff4d6d;
      flex-shrink: 0;
    }
    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    .ability-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (min-width: 640px) {
      .ability-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .ab-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: cardIn 0.4s ease both;
    }
    .ab-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(79,100,200,0.1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ab-card:nth-child(1) { animation-delay: 0.05s; }
    .ab-card:nth-child(2) { animation-delay: 0.1s; }
    .ab-card:nth-child(3) { animation-delay: 0.15s; }
    .ab-card:nth-child(4) { animation-delay: 0.2s; }
    .ab-card:nth-child(5) { animation-delay: 0.25s; }

    .ab-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 14px 0 0 14px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .card-name {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .card-icon {
      width: 28px; height: 28px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .level-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .score-row {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-bottom: 10px;
    }
    .score-num {
      font-size: 28px;
      font-weight: 700;
      font-family: 'DM Mono', monospace;
      line-height: 1;
    }
    .score-unit { font-size: 13px; font-weight: 500; color: var(--text-dim); }

    .bar-wrap { margin-bottom: 10px; }
    .bar-bg {
      height: 6px;
      background: rgba(79,124,255,0.08);
      border-radius: 6px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 6px;
      animation: grow 0.9s cubic-bezier(0.16,1,0.3,1) 0.2s both;
    }
    @keyframes grow { from { width: 0 !important; } }

    .card-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .theme-green .ab-card::before { background: #00b894; }
    .theme-green .card-icon { background: rgba(0,184,148,0.1); }
    .theme-green .score-num { color: #00966e; }
    .theme-green .bar-fill { background: linear-gradient(90deg, #00b894, #00d9b0); }
    .theme-green .level-badge { background: rgba(0,184,148,0.1); color: #009e7a; border: 1px solid rgba(0,184,148,0.2); }

    .theme-blue .ab-card::before { background: #4f7cff; }
    .theme-blue .card-icon { background: rgba(79,124,255,0.1); }
    .theme-blue .score-num { color: #3a65e8; }
    .theme-blue .bar-fill { background: linear-gradient(90deg, #4f7cff, #7c9fff); }
    .theme-blue .level-badge { background: rgba(79,124,255,0.08); color: #3d65e0; border: 1px solid rgba(79,124,255,0.18); }

    .theme-orange .ab-card::before { background: #f5a623; }
    .theme-orange .card-icon { background: rgba(245,166,35,0.1); }
    .theme-orange .score-num { color: #c47d00; }
    .theme-orange .bar-fill { background: linear-gradient(90deg, #f5a623, #ffc043); }
    .theme-orange .level-badge { background: rgba(245,166,35,0.1); color: #c47d00; border: 1px solid rgba(245,166,35,0.2); }

    .theme-red .ab-card::before { background: #ff4d6d; }
    .theme-red .card-icon { background: rgba(255,77,109,0.09); }
    .theme-red .score-num { color: #d03050; }
    .theme-red .bar-fill { background: linear-gradient(90deg, #ff4d6d, #ff7c94); }
    .theme-red .level-badge { background: rgba(255,77,109,0.08); color: #d03050; border: 1px solid rgba(255,77,109,0.18); }
  </style>
</head>
<body>

<div class="page-wrap">
  <div class="breadcrumb">
    <span class="bc-tag">职业规划智能体</span>
    <span class="bc-sep">›</span>
    <span class="bc-cur">职业测评问卷</span>
  </div>

  <div class="page-header">
    <div class="page-title">职业测评问卷</div>
    <div class="page-desc">请根据您的真实情况回答以下问题，帮助我们更好地了解您的职业倾向</div>
  </div>

  <div class="main-card">
    <div class="card-body">
      <div class="illustration">
        <div class="illus-circle">📋</div>
      </div>
      <div class="status-title">您已有测评报告，可查看最新报告或重新测评。</div>
      <div class="status-desc">
        系统已根据您的测评结果生成个性化职业规划报告，<br>
        您可以查看最新报告，或重新作答以获取更新的分析结果。
      </div>

      <div class="report-meta">
        <div class="meta-item">
          <div class="meta-label">最近测评</div>
          <div class="meta-val" id="metaDate">2026-02-22</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">完成题目</div>
          <div class="meta-val accent" id="metaQuestions">20 道</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">能力详细分析得分</div>
          <div class="meta-val green" id="metaAbilityAvg">— 分</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">历史报告</div>
          <div class="meta-val" id="metaHistory">0 份</div>
        </div>
      </div>

      <div class="btn-group">
        <button type="button" class="btn btn-primary" id="btnLatest">查看最新报告</button>
        <button type="button" class="btn btn-secondary" id="btnHistory">查看历史报告</button>
        <button type="button" class="btn btn-secondary" id="btnRetake">🔄 重新测评</button>
      </div>
    </div>
    <div class="card-footer">
      <span class="footer-text">💡 建议每隔 <span>3–6 个月</span> 重新测评一次，以获取更准确的职业规划建议</span>
    </div>
  </div>

  <!-- 能力详细分析（5 个维度，等权） -->
  <div class="ability-section">
    <div class="section-header">
      <div class="section-dot"></div>
      <div class="section-title">能力详细分析</div>
    </div>
    <div class="ability-grid" id="abilityGrid"></div>
  </div>
</div>

<script>
  // 5 个能力维度（与测评报告一致），等权计分
  const ABILITY_DIMENSIONS = [
    { name: '学习能力', icon: '📚', score: 63, level: '一般', theme: 'theme-orange', desc: '可通过练习与项目实践持续提升' },
    { name: '沟通表达能力', icon: '💬', score: 63, level: '一般', theme: 'theme-orange', desc: '可通过练习与项目实践持续提升' },
    { name: '执行能力', icon: '⚡', score: 63, level: '一般', theme: 'theme-orange', desc: '可通过练习与项目实践持续提升' },
    { name: '逻辑分析能力', icon: '🧩', score: 68, level: '一般', theme: 'theme-orange', desc: '可通过练习与项目实践持续提升' },
    { name: '创新能力', icon: '💡', score: 68, level: '一般', theme: 'theme-orange', desc: '可通过练习与项目实践持续提升' },
  ];

  function levelByScore(score) {
    if (score >= 80) return { level: '优秀', theme: 'theme-green' };
    if (score >= 70) return { level: '良好', theme: 'theme-blue' };
    if (score >= 60) return { level: '一般', theme: 'theme-orange' };
    return { level: '待提升', theme: 'theme-red' };
  }

  function renderAbilities(list) {
    const grid = document.getElementById('abilityGrid');
    if (!grid) return;
    grid.innerHTML = '';
    list.forEach(function(a) {
      const s = Number(a.score);
      const lev = a.level != null && a.theme ? { level: a.level, theme: a.theme } : levelByScore(s);
      const desc = (a.desc || '可通过练习与项目实践持续提升').trim();
      grid.innerHTML +=
        '<div class="' + lev.theme + '">' +
          '<div class="ab-card">' +
            '<div class="card-top">' +
              '<div class="card-name"><div class="card-icon">' + (a.icon || '📌') + '</div>' + (a.name || '') + '</div>' +
              '<span class="level-badge">' + lev.level + '</span>' +
            '</div>' +
            '<div class="score-row">' +
              '<span class="score-num">' + (s || 0) + '</span>' +
              '<span class="score-unit">分</span>' +
            '</div>' +
            '<div class="bar-wrap">' +
              '<div class="bar-bg"><div class="bar-fill" style="width:' + Math.min(100, Math.max(0, s)) + '%"></div></div>' +
            '</div>' +
            '<div class="card-desc">' + desc + '</div>' +
          '</div>' +
        '</div>';
    });
  }

  function updateMetaFromAbilities(list) {
    if (!list || list.length === 0) return;
    var sum = 0, n = 0;
    list.forEach(function(a) {
      var s = Number(a.score);
      if (typeof s === 'number' && isFinite(s)) { sum += s; n++; }
    });
    var avg = n ? Math.round(sum / n) : 0;
    var el = document.getElementById('metaAbilityAvg');
    if (el) el.textContent = avg + ' 分';
  }

  // 初始渲染（可从 URL 或父页面传入数据覆盖）
  var abilities = ABILITY_DIMENSIONS.slice();
  var params = new URLSearchParams(location.search);
  if (params.get('scores')) {
    try {
      var raw = JSON.parse(decodeURIComponent(params.get('scores')));
      if (Array.isArray(raw) && raw.length >= 5) {
        var names = ['学习能力', '沟通表达能力', '执行能力', '逻辑分析能力', '创新能力'];
        abilities = raw.slice(0, 5).map(function(v, i) {
          var s = typeof v === 'object' ? (v.score != null ? v.score : v) : Number(v);
          var lev = levelByScore(s);
          return {
            name: names[i] || (v.ability || v.name) || ('维度' + (i + 1)),
            icon: ABILITY_DIMENSIONS[i].icon,
            score: s,
            level: lev.level,
            theme: lev.theme,
            desc: (typeof v === 'object' && v.description) ? v.description : (v.suggestions && v.suggestions[0]) || ABILITY_DIMENSIONS[i].desc
          };
        });
      }
    } catch (e) {}
  }

  renderAbilities(abilities);
  updateMetaFromAbilities(abilities);

  document.getElementById('btnLatest') && document.getElementById('btnLatest').addEventListener('click', function() {
    if (window.parent !== window) window.parent.postMessage({ type: 'assessment_status', action: 'view_latest' }, '*');
    else location.href = 'index.html#/report';
  });
  document.getElementById('btnHistory') && document.getElementById('btnHistory').addEventListener('click', function() {
    if (window.parent !== window) window.parent.postMessage({ type: 'assessment_status', action: 'view_history' }, '*');
    else location.href = 'index.html#/report-history';
  });
  document.getElementById('btnRetake') && document.getElementById('btnRetake').addEventListener('click', function() {
    if (window.parent !== window) window.parent.postMessage({ type: 'assessment_status', action: 'retake' }, '*');
    else location.href = 'index.html#/assessment';
  });
</script>
</body>
</html>
